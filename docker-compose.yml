services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - tg_data:/var/lib/mysql
    networks:
      - tg-internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:?APP_UID must be set}
        APP_GID: ${APP_GID:?APP_GID must be set}
    command: >
      sh -c "python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 tipp_game.wsgi:application"
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /srv/data/tipp_game/static:/app/static
      - tg_media_volume:/app/media
      - /srv/data/tipp_game/logs:/app/logs
    environment:
      HOME: /tmp
      DJANGO_ENV: ${DJANGO_ENV:?DJANGO_ENV must be set (production|development)}
      DJANGO_SETTINGS_MODULE: tipp_game.settings
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      WB_NAME: ${WB_DATABASE}
      WB_USER: ${WB_USER}
      WB_PASSWORD: ${WB_PASSWORD}
      DB_HOST: db
      DB_PORT: "3306"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      ADMINS: ${ADMINS}
      MAILER_LIST: ${MAILER_LIST}
      CAPTCHA_LETTER_ROTATION: ${CAPTCHA_LETTER_ROTATION}
      WA_SRV: ${WA_SRV}
      WA_PORT: ${WA_PORT}
      WA_ADMIN_NUMBER: ${WA_ADMIN_NUMBER}
      TR_ID: ${TR_ID}
      TR_SECRET: ${TR_SECRET}
      TR_SK: ${TR_SK}
      OTP_TOTP_ISSUER: ${OTP_TOTP_ISSUER}
    networks:
      - tg-internal
      - proxy
    depends_on:
      db:
        condition: service_healthy

  jobs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:?APP_UID must be set}
        APP_GID: ${APP_GID:?APP_GID must be set}
    command: ["python", "--version"]
    restart: "no"
    volumes:
      - tg_media_volume:/app/media
      - /srv/data/tipp_game/logs:/app/logs
      - /srv/data/tipp_game/cron:/app/cron_out
    environment:
      HOME: /tmp
      DJANGO_ENV: ${DJANGO_ENV:?DJANGO_ENV must be set (production|development)}
      DJANGO_SETTINGS_MODULE: tipp_game.settings
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      WB_NAME: ${WB_DATABASE}
      WB_USER: ${WB_USER}
      WB_PASSWORD: ${WB_PASSWORD}
      DB_HOST: db
      DB_PORT: "3306"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      ADMINS: ${ADMINS}
      MAILER_LIST: ${MAILER_LIST}
      CAPTCHA_LETTER_ROTATION: ${CAPTCHA_LETTER_ROTATION}
      WA_SRV: ${WA_SRV}
      WA_PORT: ${WA_PORT}
      WA_ADMIN_NUMBER: ${WA_ADMIN_NUMBER}
      TR_ID: ${TR_ID}
      TR_SECRET: ${TR_SECRET}
      TR_SK: ${TR_SK}
      OTP_TOTP_ISSUER: ${OTP_TOTP_ISSUER}
      CRON_TARGET_DIR: ${CRON_TARGET_DIR:-/app/cron_out}
      CRON_TARGET_FILE: ${CRON_TARGET_FILE:-tippgame}
      CRON_EXECUTION_PREFIX: ${CRON_EXECUTION_PREFIX:-docker compose --project-directory /srv/data/tipp_game run --rm --no-deps jobs python}
    networks:
      - tg-internal
      - tg-egress
    depends_on:
      db:
        condition: service_healthy

  wallabag:
    image: wallabag/wallabag
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - SYMFONY__ENV__DATABASE_DRIVER=pdo_mysql
      - SYMFONY__ENV__DATABASE_HOST=db
      - SYMFONY__ENV__DATABASE_PORT=3306
      - SYMFONY__ENV__DATABASE_NAME=${WB_DATABASE}
      - SYMFONY__ENV__DATABASE_USER=${WB_USER}
      - SYMFONY__ENV__DATABASE_PASSWORD=${WB_PASSWORD}
      - SYMFONY__ENV__DATABASE_CHARSET=utf8mb4
      - SYMFONY__ENV__DATABASE_TABLE_PREFIX="wallabag_"
      - SYMFONY__ENV__MAILER_DSN=smtp://127.0.0.1
      - SYMFONY__ENV__FROM_EMAIL=${WB_EMAIL}
      - SYMFONY__ENV__DOMAIN_NAME=${WB_URL}
      - SYMFONY__ENV__SERVER_NAME=${WB_SERVER_NAME}
    ports:
      - "80"
    volumes:
      - /srv/data/tipp_game/wallabag/images:/var/www/wallabag/web/assets/images
    networks:
      - tg-internal
      - proxy
    depends_on:
      db:
        condition: service_healthy

volumes:
  tg_data:
  tg_media_volume:

networks:
  tg-internal:
    internal: true
  tg-egress:
  proxy:
    external: true # Tells Docker Compose this network already exists

